name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# O workflow não publica, não escreve no repositório e não usa credenciais.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Testes marcados como network são explicitamente excluídos. O pipeline
      # sintético, contratos e fixtures não fazem chamadas à RNDS.
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verificar lockfile imutável
        run: uv lock --check

      - name: Instalar dependências exatamente do lockfile
        run: uv sync --all-groups --frozen

      - name: Formatação
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tipagem estática
        run: uv run mypy src

      - name: Scanner preventivo de PII, segredos e endpoints
        # Testes contêm vetores adversariais propositalmente detectáveis. O
        # scanner cobre somente material distribuível e ignora saídas locais.
        run: >-
          uv run rnds-lab scan README.md AGENTS.md CONTRIBUTING.md SECURITY.md
          LICENSE pyproject.toml src docs contracts data/sources.yml scripts .github

      - name: Testes offline e cobertura
        run: uv run pytest -m "not network"

      - name: Auditoria de vulnerabilidades conhecidas
        # O pacote do laboratório é instalado em modo editável e ainda não é
        # publicado no PyPI; dependências bloqueadas continuam auditadas.
        run: uv run pip-audit --skip-editable --progress-spinner=off
